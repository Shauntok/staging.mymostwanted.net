services:
  clamav:
    image: ${CLAMAV_IMAGE:?Set CLAMAV_IMAGE to a versioned ClamAV image pinned by sha256 digest}
    restart: unless-stopped
    volumes:
      - clamav-databases:/var/lib/clamav
    mem_limit: 2g
    cpus: 2.0
    # No host port is published. Only containers on this Compose network can reach clamd.

  evidence-scanner:
    build:
      context: ./scanner
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:?Set NODE_BASE_IMAGE to an official Node 22 image pinned by sha256 digest}
    restart: unless-stopped
    # Let an active bounded scan finish after SIGTERM before Compose sends SIGKILL.
    stop_grace_period: 8m
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
    environment:
      MMWR_SCANNER_API_ORIGIN: ${MMWR_SCANNER_API_ORIGIN:?Set the HTTPS MMWR app origin}
      MMWR_SUPABASE_STORAGE_ORIGIN: ${MMWR_SUPABASE_STORAGE_ORIGIN:?Set the HTTPS Supabase project origin}
      EVIDENCE_SCANNER_TOKEN: ${EVIDENCE_SCANNER_TOKEN:?Set a random token of at least 32 bytes}
      MMWR_PUBLIC_THUMBNAILS_ENABLED: ${MMWR_PUBLIC_THUMBNAILS_ENABLED:-false}
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
    depends_on:
      clamav:
        condition: service_started

volumes:
  clamav-databases:
